[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# Este archivo esta en el arbol del §4.1 pero NINGUNA tarea T-XXX lo declara en
# su lista de archivos: ni T-004 ni T-005 lo nombran. Se atribuye a T-001, que
# es la tarea duena de la estructura del monorepo.
#
# Sin el no hay forma de correr un test, y el bloque 4 es TDD estricto.
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "deruedas-backend"
version = "0.1.0"
description = "API de deRuedas Gestion — SaaS multi-tenant para agencias de vehiculos"
requires-python = "==3.12.*"   # ADR-003, version exacta

dependencies = [
    # Configuracion — lo unico que T-004 necesita de verdad.
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",

    # API. Entra en uso en el bloque 5 (T-005), pero el CMD del Dockerfile y el
    # servicio `backend` del compose ya lo invocan.
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",

    # Persistencia. Bloque 6 (T-007) y en adelante.
    "sqlalchemy[asyncio]>=2.0,<3",   # API moderna, no legacy
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",

    # Cache, Streams y cola. ADR-009.
    "redis>=5.0,<6",
    "celery>=5.4,<6",
]

[project.optional-dependencies]
# Los pisos de `pytest` y `black` los fija el job de seguridad del CI, no el
# gusto: PYSEC-2026-1845 (pytest, corregida en 9.0.3) y PYSEC-2026-2120 /
# PYSEC-2026-2121 (black, corregidas en 26.3.0 y 26.3.1). `pip-audit` bloquea
# ante cualquier vulnerabilidad porque no expone severidad, asi que bajar
# cualquiera de los dos pisos deja el pipeline en rojo.
#
# `pytest-asyncio` sube a la serie 1.x a proposito. Manteniendo el techo `<1`,
# pip retrocedia hasta 0.23.3 para poder instalar pytest 9: esa version no
# declara incompatibilidad, pero tampoco soporta pytest 9 -- es compatibilidad
# accidental. La serie 1.x lo soporta de verdad.
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<8",
    "httpx>=0.27,<1",        # cliente de tests de FastAPI
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "black>=26.3.1,<27",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Explicito a proposito, no por gusto: si se deja sin fijar, pytest-asyncio
# emite un warning en tiempo de configuracion, y `--strict-config` (mas abajo)
# convierte ese warning en error. El pipeline se caeria por un default no
# declarado, que es el peor motivo posible para un rojo.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: usa servicios reales (PostgreSQL, Redis, MinIO). Se excluye de la corrida unitaria.",
]
addopts = "--strict-markers --strict-config"

# ─────────────────────────────────────────────────────────────────────────────
# Umbrales fijados por docs/adr/ADR-014-umbrales-de-cobertura.md:
# 80 % de lineas y 60 % de ramas, ambos globales sobre el backend, bloqueantes.
[tool.coverage.run]
source = ["app"]
branch = true          # sin esto no hay cobertura de ramas que medir
omit = [
    # Exclusiones UNA POR UNA, con motivo. ADR-014 prohibe expresamente los
    # comodines amplios: una exclusion que nadie puede auditar es un agujero
    # con permiso.
    "app/__init__.py",   # marcador de paquete, sin logica
]

[tool.coverage.report]
fail_under = 80          # lineas — Constitucion Art. 2
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",       # solo se evalua al chequear tipos
    "raise NotImplementedError",
]

# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit — seguridad
]
ignore = [
    "E501",     # largo de linea: lo maneja black
]

[tool.ruff.lint.per-file-ignores]
# S101: assert. Es el mecanismo de pytest; prohibirlo en tests no tiene sentido.
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
# Existe un directorio backend/alembic/, asi que isort infiere que `alembic` es
# modulo propio del proyecto y lo quiere agrupar con `app`. Es la libreria de
# terceros: el directorio solo aloja las migraciones.
known-third-party = ["alembic"]

[tool.black]
line-length = 100
target-version = ["py312"]

# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true            # regla dura 6 del proyecto
warn_unreachable = true
plugins = ["pydantic.mypy"]

# asyncpg no publica stubs ni marcador py.typed. El override es POR MODULO, no
# global: silenciar los imports sin tipar en todo el proyecto taparia errores
# reales del codigo propio.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
