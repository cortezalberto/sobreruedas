# ─────────────────────────────────────────────────────────────────────────────
# Alembic — T-007
#
# La URL de la base NO va aca. Sale de Settings en alembic/env.py, que la lee
# de DATABASE_URL (ADR-013). Poner la cadena de conexion en este archivo la
# versionaria con la contrasena adentro, y eso viola el Art. 3.
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
script_location = alembic

# NNN_descripcion.py, como pide T-007. El NNN sale del `rev id`, que se asigna
# a mano correlativo — usa `make migration name=agrega_vehiculos`, que calcula
# el siguiente numero solo.
#
# Correlativo y no hash: con una revision por PR, el orden se lee del `ls` y
# los conflictos de merge sobre el mismo numero saltan en el diff en lugar de
# producir dos cabezas silenciosas.
file_template = %%(rev)s_%%(slug)s

# Las marcas temporales de las migraciones en UTC. Un equipo distribuido con
# timestamps en hora local produce un historial que no ordena.
timezone = UTC

# Largo maximo del slug tomado del mensaje.
truncate_slug_length = 40

prepend_sys_path = .

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

# ─────────────────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
